name: Android APK bauen
on:
  push:
    paths:
      - 'aktien-app-source.zip'
      - 'upload/aktien-app-source.zip'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android-SDK-Lizenzen akzeptieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Quellcode-ZIP automatisch entpacken
        run: |
          ZIP=$(find . -maxdepth 2 -name 'aktien-app-source.zip' | head -n 1)
          if [ -z "$ZIP" ]; then echo "::error::ZIP nicht gefunden"; exit 1; fi
          rm -rf build-src && mkdir build-src
          unzip -q "$ZIP" -d build-src
          SETTINGS=$(find build-src -name 'settings.gradle.kts' | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "::error::settings.gradle.kts fehlt"; exit 1; fi
          echo "APP_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
      - name: Debug-APK bauen
        working-directory: ${{ env.APP_DIR }}
        run: gradle :app:assembleDebug --no-daemon -Pkotlin.jvm.target.validation.mode=ignore
      - run: cp "$APP_DIR/app/build/outputs/apk/debug/app-debug.apk" Aktien-Watchlist.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aktien-Watchlist-debug-apk
          path: Aktien-Watchlist.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: Aktien-Watchlist.apk
